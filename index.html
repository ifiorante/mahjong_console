<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Animations</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: monospace;
        }
        #animationContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #gifDisplay {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: contain; /* Scales proportionally to fit the screen */
        }
        #debugLog {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 320px;
            height: 80px;
            background: rgba(17, 17, 17, 0.85);
            color: #3fb950;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            overflow-y: auto;
            text-align: left;
            z-index: 10;
            pointer-events: none; /* Allows clicks right through it */
        }
    </style>
</head>
<body>

    <div id="animationContainer">
        <img id="gifDisplay" alt="Meld Animation">
    </div>

    <div id="debugLog">Script starting...</div>

    <script>
        const AIO_USERNAME = "fiorante";
        const AIO_FEED = "mahjong-meld";
        
        let lastProcessedId = null;
        let isInitialized = false;

        const gifDisplay = document.getElementById("gifDisplay");
        const debugLog = document.getElementById("debugLog");
        let resetTimer = null;

        const PUNG_GIF_PATH = "PUNG.gif";
        const CHOW_GIF_PATH = "CHOW.gif";

        function logMessage(msg) {
            console.log(msg);
            debugLog.innerHTML += "<br>" + msg;
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        async function checkFeed() {
            try {
                let response = await fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/${AIO_FEED}/data/last`);
                if (!response.ok) return;
                
                let data = await response.json();
                let latestValue = data.value;
                let dataId = data.id;

                if (!isInitialized) {
                    lastProcessedId = dataId;
                    isInitialized = true;
                    logMessage(`Initialized. ID: ${dataId}`);
                    return;
                }

                if (dataId && dataId !== lastProcessedId) {
                    lastProcessedId = dataId;
                    logMessage(`*** TRIGGER: ${latestValue} ***`);

                    if (latestValue === "pung") {
                        playGif(PUNG_GIF_PATH);
                    } else if (latestValue === "chow") {
                        playGif(CHOW_GIF_PATH);
                    }
                }
            } catch (error) {
                logMessage("Fetch error: " + error.message);
            }
        }

        function playGif(gifPath) {
            gifDisplay.style.display = "none";
            gifDisplay.src = "";

            setTimeout(() => {
                gifDisplay.src = gifPath + "?t=" + new Date().getTime();
                gifDisplay.style.display = "block";
                logMessage("Playing: " + gifPath);
            }, 50);

            if (resetTimer) clearTimeout(resetTimer);

            resetTimer = setTimeout(() => {
                gifDisplay.style.display = "none";
                gifDisplay.src = "";
            }, 6000);
        }

        setInterval(checkFeed, 2000);
        logMessage("Polling active.");
    </script>
</body>
</html>
