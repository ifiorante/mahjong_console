<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Animations</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #animationCanvas {
            background-color: #0b0f19;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Clean canvas for your animations -->
    <canvas id="animationCanvas" width="600" height="400"></canvas>

    <script>
        const AIO_USERNAME = "fiorante";
        const AIO_FEED = "mahjong-meld";
        
        let lastProcessedTimestamp = null;
        let isInitialLoad = true;
        const pageLoadTime = new Date().getTime();

        const canvas = document.getElementById("animationCanvas");
        const ctx = canvas.getContext("2d");

        // Initial idle screen draw
        drawIdleState();

        async function checkFeed() {
            try {
                let response = await fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/${AIO_FEED}/data/last`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                let data = await response.json();
                let latestValue = data.value;
                let timestamp = data.created_at;
                let dataTime = new Date(timestamp).getTime();

                if (isInitialLoad) {
                    lastProcessedTimestamp = timestamp;
                    isInitialLoad = false;
                    return;
                }

                if (timestamp !== lastProcessedTimestamp && dataTime > pageLoadTime) {
                    lastProcessedTimestamp = timestamp;
                    console.log("New meld received:", latestValue);

                    if (latestValue === "pung") {
                        triggerPungAnimation();
                    } else if (latestValue === "chow") {
                        triggerChowAnimation();
                    }
                }
            } catch (error) {
                console.error("Error fetching feed:", error);
            }
        }

        function drawIdleState() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#161b22";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Leave completely blank or draw subtle background visuals here if desired
        }

        function triggerPungAnimation() {
            console.log("Playing Pung Animation...");
            
            // --- REPLACE WITH YOUR CUSTOM PUNG ANIMATION CODE ---
            ctx.fillStyle = "#f85149";
            ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);
            
            // Auto-clear back to idle after 4 seconds
            setTimeout(drawIdleState, 4000);
        }

        function triggerChowAnimation() {
            console.log("Playing Chow Animation...");
            
            // --- REPLACE WITH YOUR CUSTOM CHOW ANIMATION CODE ---
            ctx.fillStyle = "#3fb950";
            ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);
            
            // Auto-clear back to idle after 4 seconds
            setTimeout(drawIdleState, 4000);
        }

        // Poll Adafruit IO every 2 seconds
        setInterval(checkFeed, 2000);
    </script>
</body>
</html>
