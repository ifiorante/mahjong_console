<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Animations</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        #animationContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #gifDisplay {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: contain; /* Keeps aspect ratio; change to 'cover' to fill edge-to-edge */
        }
        #fullscreenOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #3fb950;
            z-index: 999;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #fullscreenOverlay h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        #fullscreenOverlay p {
            color: #8b949e;
            font-size: 14px;
        }
        #debugLog {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 320px;
            height: 80px;
            background: rgba(17, 17, 17, 0.85);
            color: #3fb950;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            overflow-y: auto;
            text-align: left;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Tap this once to lock in true fullscreen and start polling -->
    <div id="fullscreenOverlay" onclick="startApp()">
        <h1>TAP TO START MAHJONG DISPLAY</h1>
        <p>Enters true full-screen mode and connects to ESP32</p>
    </div>

    <div id="animationContainer">
        <img id="gifDisplay" alt="Meld Animation">
    </div>

    <div id="debugLog">Waiting for fullscreen activation...</div>

    <script>
        const AIO_USERNAME = "fiorante";
        const AIO_FEED = "mahjong-meld";
        
        let lastProcessedId = null;
        let isInitialized = false;
        let pollingInterval = null;

        const gifDisplay = document.getElementById("gifDisplay");
        const debugLog = document.getElementById("debugLog");
        const overlay = document.getElementById("fullscreenOverlay");
        let resetTimer = null;

        const PUNG_GIF_PATH = "PUNG.gif";
        const CHOW_GIF_PATH = "CHOW.gif";

        function logMessage(msg) {
            console.log(msg);
            debugLog.innerHTML += "<br>" + msg;
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        // Required user gesture to enter hardware fullscreen on iOS/iPadOS
        function startApp() {
            // Request full screen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }

            // Hide the tap overlay
            overlay.style.display = "none";
            logMessage("Fullscreen activated. Starting poll...");

            // Run initial check immediately
            checkFeed();

            // Then poll every 2 seconds
            if (!pollingInterval) {
                pollingInterval = setInterval(checkFeed, 2000);
            }
        }

        async function checkFeed() {
            try {
                let response = await fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/${AIO_FEED}/data/last`);
                if (!response.ok) return;
                
                let data = await response.json();
                let latestValue = data.value;
                let dataId = data.id;

                if (!isInitialized) {
                    lastProcessedId = dataId;
                    isInitialized = true;
                    logMessage(`Initialized. ID: ${dataId}`);
                    return;
                }

                if (dataId && dataId !== lastProcessedId) {
                    lastProcessedId = dataId;
                    logMessage(`*** TRIGGER: ${latestValue} ***`);

                    if (latestValue === "pung") {
                        playGif(PUNG_GIF_PATH);
                    } else if (latestValue === "chow") {
                        playGif(CHOW_GIF_PATH);
                    }
                }
            } catch (error) {
                logMessage("Fetch error: " + error.message);
            }
        }

        function playGif(gifPath) {
            gifDisplay.style.display = "none";
            gifDisplay.src = "";

            setTimeout(() => {
                gifDisplay.src = gifPath + "?t=" + new Date().getTime();
                gifDisplay.style.display = "block";
                logMessage("Playing: " + gifPath);
            }, 50);

            if (resetTimer) clearTimeout(resetTimer);

            // Change 4000 to however many milliseconds you want it to play (e.g. 2 times the GIF length)
            resetTimer = setTimeout(() => {
                gifDisplay.style.display = "none";
                gifDisplay.src = "";
            }, 10000);
        }
    </script>
</body>
</html>
