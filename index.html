<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Animations</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #animationContainer {
            position: relative;
            width: 700px;
            height: 450px;
            background-color: #0b0f19;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #gifDisplay {
            max-width: 100%;
            max-height: 100%;
            display: none; /* Hidden until triggered */
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="animationContainer">
        <!-- GIF overlay element -->
        <img id="gifDisplay" src="" alt="Meld Animation">
    </div>

    <script>
        const AIO_USERNAME = "fiorante";
        const AIO_FEED = "mahjong-meld";
        
        let lastProcessedTimestamp = null;
        let isInitialLoad = true;
        const pageLoadTime = new Date().getTime();

        const gifDisplay = document.getElementById("gifDisplay");
        let resetTimer = null;

        // Path to your GIFs sitting in the GitHub repository root
        const PUNG_GIF_PATH = "pung.gif";
        const CHOW_GIF_PATH = "chow.gif";

        // Preload images into browser cache so there is no delay on tap
        const pungPreload = new Image();
        pungPreload.src = PUNG_GIF_PATH;

        const chowPreload = new Image();
        chowPreload.src = CHOW_GIF_PATH;

        async function checkFeed() {
            try {
                let response = await fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/${AIO_FEED}/data/last`);
                if (!response.ok) return;
                
                let data = await response.json();
                let latestValue = data.value;
                let timestamp = data.created_at;
                let dataTime = new Date(timestamp).getTime();

                if (isInitialLoad) {
                    lastProcessedTimestamp = timestamp;
                    isInitialLoad = false;
                    return;
                }

                if (timestamp !== lastProcessedTimestamp && dataTime > pageLoadTime) {
                    lastProcessedTimestamp = timestamp;
                    console.log("New meld received:", latestValue);

                    if (latestValue === "pung") {
                        playGif(PUNG_GIF_PATH);
                    } else if (latestValue === "chow") {
                        playGif(CHOW_GIF_PATH);
                    }
                }
            } catch (error) {
                console.error("Error fetching feed:", error);
            }
        }

        function playGif(gifPath) {
            // Append timestamp cache-buster to force the GIF animation to restart from frame 0
            gifDisplay.src = gifPath + "?t=" + new Date().getTime();
            gifDisplay.style.display = "block";

            // Clear any existing reset timeout
            if (resetTimer) clearTimeout(resetTimer);

            // Hide GIF and return to blank screen after 4 seconds
            resetTimer = setTimeout(() => {
                gifDisplay.style.display = "none";
                gifDisplay.src = "";
            }, 4000);
        }

        // Poll Adafruit IO every 2 seconds
        setInterval(checkFeed, 2000);
    </script>
</body>
</html>
