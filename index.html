<!DOCTYPE html>
<html>
<head>
    <title>Mahjong Animations</title>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
        #animation-box { font-size: 48px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Waiting for Mahjong Meld...</h1>
    <div id="animation-box">💤</div>

    <script>
        const AIO_USERNAME = "fiorante";
        const AIO_FEED = "mahjong-meld";
        const AIO_KEY = "aio_qNvV34JFIaFBtQTvh1cYgLqgCNqz"; // Note: For production public feeds, keys can be omitted, but keeping it ensures access.

        async function checkFeed() {
            try {
                let response = await fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/${AIO_FEED}/data/last`, {
                    headers: { 'X-AIO-Key': AIO_KEY }
                });
                let data = await response.json();
                
                // Check the latest value sent to Adafruit IO
                let latestValue = data.value;
                console.log("Latest feed value:", latestValue);

                if (latestValue === "pung") {
                    triggerPungAnimation();
                } else if (latestValue === "chow") {
                    triggerChowAnimation();
                }
            } catch (error) {
                console.error("Error fetching feed:", error);
            }
        }

        function triggerPungAnimation() {
            document.getElementById("animation-box").innerHTML = "🔥 PUNG! THREE OF A KIND! 🔥";
            // Add your custom animation code here
        }

        function triggerChowAnimation() {
            document.getElementById("animation-box").innerHTML = "✨ CHOW! SEQUENCE! ✨";
            // Add your custom animation code here
        }

        // Poll Adafruit IO every 2 seconds
        setInterval(checkFeed, 2000);
    </script>
</body>
</html>
