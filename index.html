<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Animations</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        #animationContainer {
            position: relative;
            width: 700px;
            height: 400px;
            background-color: #0b0f19;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #gifDisplay {
            max-width: 100%;
            max-height: 100%;
            display: none;
            object-fit: contain;
        }
        /* Visible debug box on screen */
        #debugLog {
            width: 700px;
            height: 80px;
            background: #111;
            color: #3fb950;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            overflow-y: auto;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="animationContainer">
        <img id="gifDisplay" src="" alt="Meld Animation">
    </div>

    <!-- On-screen status box so you can see what's happening -->
    <div id="debugLog">Initializing page...</div>

    <script>
        const AIO_USERNAME = "fiorante";
        const AIO_FEED = "mahjong-meld";
        
        let lastProcessedTimestamp = null;
        let isInitialized = false;

        const gifDisplay = document.getElementById("gifDisplay");
        const debugLog = document.getElementById("debugLog");
        let resetTimer = null;

        const PUNG_GIF_PATH = "pung.gif";
        const CHOW_GIF_PATH = "chow.gif";

        // Preload images
        const pungPreload = new Image();
        pungPreload.src = PUNG_GIF_PATH;
        const chowPreload = new Image();
        chowPreload.src = CHOW_GIF_PATH;

        function logMessage(msg) {
            console.log(msg);
            debugLog.innerHTML += "<br>" + msg;
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        async function checkFeed() {
            try {
                let response = await fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/${AIO_FEED}/data/last`);
                if (!response.ok) {
                    logMessage("HTTP Error: " + response.status);
                    return;
                }
                
                let data = await response.json();
                let latestValue = data.value;
                let timestamp = data.created_at;

                if (!isInitialized) {
                    lastProcessedTimestamp = timestamp;
                    isInitialized = true;
                    logMessage("Connected! Baseline set: " + timestamp);
                    return;
                }

                if (timestamp && timestamp !== lastProcessedTimestamp) {
                    lastProcessedTimestamp = timestamp;
                    logMessage("NEW MELD: " + latestValue);

                    if (latestValue === "pung") {
                        playGif(PUNG_GIF_PATH);
                    } else if (latestValue === "chow") {
                        playGif(CHOW_GIF_PATH);
                    }
                }
            } catch (error) {
                logMessage("Fetch error: " + error.message);
            }
        }

        function playGif(gifPath) {
            gifDisplay.src = gifPath + "?t=" + new Date().getTime();
            gifDisplay.style.display = "block";

            if (resetTimer) clearTimeout(resetTimer);

            resetTimer = setTimeout(() => {
                gifDisplay.style.display = "none";
                gifDisplay.src = "";
            }, 4000);
        }

        // Poll every 2 seconds
        setInterval(checkFeed, 2000);
    </script>
</body>
</html>
